[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spotd"
version = "1.0.0"
description = "ESDS Spot Customer Request Handling — production service (HLD v0.1 / LLD)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "orjson>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
spotd = "spotd.cli:main"

[tool.setuptools.packages.find]
include = ["spotd*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:spotd.*"]
markers = [
    "slow: load and soak tests, deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["spotd"]
omit = ["spotd/seed/*", "*/migrations/*"]
